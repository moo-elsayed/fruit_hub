name: fruit_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Assets
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  toastification: ^3.0.3
  google_fonts: ^8.2.1
  flutter_svg: ^2.2.1
  animate_do: ^5.1.0
  gap: ^3.0.1
  carousel_slider: ^5.1.1
  skeletonizer: ^2.1.0+1
  cached_network_image: ^3.4.1

  # Logic & State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.3
  restart_app: ^1.3.2
  logger: ^2.6.2

  # Security & Environment
  envied: ^1.3.0

  # Backend & Services
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2
  cloud_firestore: ^6.0.2

  # Payment
  flutter_paypal_payment: ^1.0.8
  flutter_stripe: ^14.0.0

  # Networking
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Tools & Launchers
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0
  flutter_native_splash: ^2.4.6

  # Code Generation
  envied_generator: ^1.3.0
  build_runner: ^2.10.4

  # Testing
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  bloc_test: ^10.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/svgs/icons/
    - assets/translations/
    - assets/images/
