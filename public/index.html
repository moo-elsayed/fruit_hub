<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Hub - تطبيق هَب الفواكه</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F7FBF8;
      color: #1B5E20;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin: 16px 0 8px;
      color: #2E7D32;
    }
    p {
      color: #616161;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #1B5E20;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2E7D32;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 54px;">🥑</div>
    <h1>Fruit Hub</h1>
    <p>جارٍ نقلك لتطبيق Fruit Hub للحصول على أفضل وأطزج الفواكه...</p>
    <a id="open-btn" class="btn" href="#">فتح في تطبيق Fruit Hub</a>
  </div>

  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const appSchemeUrl = 'fruithub:/' + path + search;
    document.getElementById('open-btn').href = appSchemeUrl;

    // Auto-attempt redirect if opened on mobile browser
    if (/android|iphone|ipad/i.test(navigator.userAgent)) {
      setTimeout(() => {
        window.location.href = appSchemeUrl;
      }, 500);
    }
  </script>
</body>
</html>
